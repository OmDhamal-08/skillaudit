[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillaudit"
version = "0.1.0"
description = "Security scanner for Claude skills: check a skill before you install it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Om Dhamal" }]
requires-python = ">=3.10"
keywords = ["security", "claude", "skills", "prompt-injection", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skillaudit = "skillaudit.cli:app"

[project.urls]
Homepage = "https://github.com/OmDhamal-08/skillaudit"

[tool.hatch.build.targets.wheel]
packages = ["src/skillaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
